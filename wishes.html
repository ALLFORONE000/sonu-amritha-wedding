<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080604"><title>Private Wishes Book | Sonu &amp; Amritha</title>

</style></head><body><main class="wrap"><div class="orn">◆ ✦ ◆</div><h1 class="script">Our Wedding Wishes</h1><section class="panel"><h2>Sonu &amp; Amritha</h2><p class="muted">This is a private keepsake for the people we love. Please enter the access password shared with you.</p><form id="gate"><input id="pass" type="password" autocomplete="current-password" placeholder="Access password" required><button type="submit">Open the Book</button></form><p class="status" id="status" role="status"></p><p class="fine">The wishes book is being connected to its private storage. Messages will appear here once the secure connection is configured.</p></section><p><a class="back" href="index.html">← Back to invitation</a></p></main>
