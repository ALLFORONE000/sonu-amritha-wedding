<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>Wishes Book | Sonu &amp; Amritha</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold-hi:#f1dfa0;--gold-lo:#8f6f22;--cream:#efe2c2;--bg:#050403;--hair:rgba(212,175,55,.45);box-sizing:border-box}
*{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.55;
background:radial-gradient(ellipse at 50% 0,#22170b 0,#0c0804 50%,var(--bg) 80%) fixed;
padding:max(34px,env(safe-area-inset-top)) 22px max(30px,env(safe-area-inset-bottom));display:flex;justify-content:center;overflow-x:hidden}
.wrap{position:relative;width:100%;max-width:600px;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center}
.gold{background:linear-gradient(100deg,var(--gold-lo),var(--gold-hi) 40%,var(--gold) 62%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold)}
.eyebrow{font-size:.72rem;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);opacity:.85;margin:0 0 4px;padding-left:.5em}
h1.script{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(2.9rem,12vw,4.6rem);line-height:1.2;margin:0;padding:.08em .15em}
.sub{font-style:italic;font-size:1.05rem;letter-spacing:.14em;color:#b9aa83;margin:0 0 30px}

/* divider */
.div{display:flex;align-items:center;gap:14px;width:min(78%,300px);margin:6px auto;color:var(--gold)}
.div::before,.div::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--hair))}
.div::after{transform:scaleX(-1)}
.div i{width:6px;height:6px;transform:rotate(45deg);border:1px solid var(--gold);display:block}

/* ===== scroll ===== */
.scroll{position:relative;display:grid;width:min(calc(100vw - 20px),860px);margin:6px 0}
.closed,.opened{grid-area:1/1;align-self:center;container-type:inline-size;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(180deg,transparent,#000 6%,#000 94%,transparent);mask-composite:intersect;}
.closed{position:relative;transition:opacity .9s ease}
.closed img.base{display:block;width:100%;height:auto;aspect-ratio:3/2;user-select:none;-webkit-user-drag:none}
.seal{position:absolute;z-index:3;left:42.057%;top:33.984%;width:17.773%;height:26.66%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.seal::before{content:"";position:absolute;inset:4%;border-radius:50%;animation:pulse 2.8s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,200,90,.55)}75%,100%{box-shadow:0 0 0 22px rgba(240,200,90,0)}}
.seal-half{position:absolute;inset:0;filter:drop-shadow(0 4px 5px rgba(50,25,5,.55));will-change:transform,opacity}

.seal-half.l .clip{clip-path:polygon(0 0,52% 0,46% 14%,56% 30%,45% 48%,55% 66%,47% 84%,51% 100%,0 100%)}
.seal-half.r .clip{clip-path:polygon(52% 0,100% 0,100% 100%,51% 100%,47% 84%,55% 66%,45% 48%,56% 30%,46% 14%)}
.scroll.broken .seal{pointer-events:none}
.scroll.broken .seal::before{animation:none;opacity:0}
.scroll.broken .seal-half.l{animation:fallL 1.25s cubic-bezier(.4,0,.75,.55) both}
.scroll.broken .seal-half.r{animation:fallR 1.25s cubic-bezier(.4,0,.75,.55) both}
@keyframes fallL{0%{transform:none;opacity:1}14%{transform:translate(-4%,-3%) rotate(-4deg);opacity:1}70%{opacity:1}100%{transform:translate(-26%,150%) rotate(-30deg);opacity:0}}
@keyframes fallR{0%{transform:none;opacity:1}14%{transform:translate(4%,-3%) rotate(4deg);opacity:1}70%{opacity:1}100%{transform:translate(28%,170%) rotate(34deg);opacity:0}}
.scroll.opening .closed{opacity:0;pointer-events:none}
.scroll.shake{animation:sh .4s}

.opened{position:relative;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s 1s}

/* ===== login ===== */
.panel{width:100%;margin-top:22px}
.seal-note{font-style:italic;font-size:1.08rem;color:#bfb08a;margin:14px auto 0;max-width:340px}
.field{position:relative;margin:22px auto 20px;max-width:340px}
input{width:100%;padding:12px 44px;background:transparent;border:0;border-bottom:1px solid var(--hair);border-radius:0;color:var(--gold-hi);font:inherit;font-size:1.2rem;text-align:center;letter-spacing:.3em;outline:none;transition:border-color .25s,box-shadow .25s}
input::placeholder{letter-spacing:.22em;font-size:.78rem;text-transform:uppercase;color:#7d7152}
input:focus{border-bottom-color:var(--gold-hi);box-shadow:0 1px 0 0 var(--gold-hi)}
.eye{position:absolute;right:0;top:50%;transform:translateY(-50%);width:38px;height:38px;margin:0;padding:0;border:0;display:grid;place-items:center;color:#a98f45;background:none;cursor:pointer}
.eye:hover{color:var(--gold-hi)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-hi);background:transparent;border:1px solid rgba(212,175,55,.6);border-radius:999px;padding:14px 34px 14px calc(34px + .3em);margin:5px;transition:background .25s,border-color .25s,box-shadow .25s,transform .15s}
.btn:hover:not(:disabled){background:rgba(212,175,55,.1);border-color:var(--gold-hi);box-shadow:0 0 22px rgba(212,175,55,.15)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(100deg,rgba(143,111,34,.35),rgba(212,175,55,.22),rgba(143,111,34,.35));border-color:var(--gold)}
.btn.small{padding:11px 22px 11px calc(22px + .3em);font-size:.7rem}
button:focus-visible,a:focus-visible,input:focus-visible,.seal:focus-visible{outline:1px solid var(--gold-hi);outline-offset:4px}
.status{min-height:1.6em;color:#e3c866;font-size:1rem;margin:8px 0 0}
.status.err{color:#f0a392}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ===== wish page ===== */
.page{position:relative;width:100%;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2px 0}
.page h2{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(2rem,7.4cqw,3.2rem);line-height:1.15;color:#6b3a14;margin:0 0 6px;text-shadow:0 1px 0 rgba(255,240,200,.35)}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;color:#7a4a1c;font-size:.7rem;letter-spacing:.4em;margin:0 0 14px}
.rule::before,.rule::after{content:"";width:11cqw;height:1px;background:#7a4a1c;opacity:.65}
.message{font-size:clamp(1.15rem,4.4cqw,1.6rem);line-height:1.6;font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;color:#4a2c10}
.guest{margin-top:18px;font-weight:600;font-size:clamp(1rem,3.6cqw,1.25rem);letter-spacing:.06em;color:#5b3a18}
.guest::before{content:"";display:block;width:44px;height:1px;background:#7a4a1c;margin:0 auto 10px}
.empty .message{font-style:normal;color:#6a4a26}
.flip-next{animation:inR .5s cubic-bezier(.2,.7,.2,1)}
.flip-prev{animation:inL .5s cubic-bezier(.2,.7,.2,1)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}

/* ===== controls ===== */
#book{display:none;width:100%;margin-top:14px}
.nav{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
#counter{min-width:84px;color:var(--gold-hi);letter-spacing:.2em;font-size:.95rem}
.bar{width:min(100%,260px);height:1px;background:rgba(212,175,55,.2);margin:14px auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.hint{font-size:.88rem;font-style:italic;color:#847752;margin:12px 0 4px}
.topbar{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.back{display:inline-block;margin-top:30px;font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;color:#a99a72;text-decoration:none;padding-bottom:4px;border-bottom:1px solid rgba(212,175,55,.25);transition:color .2s,border-color .2s}
.back:hover{color:var(--gold-hi);border-color:var(--gold)}
@media(prefers-reduced-motion:reduce){.flip-next,.flip-prev,.shake{animation:none}.sheet-wrap,.opened,.closed,#pages{transition-duration:.01s!important;transition-delay:0s!important}.seal-half{animation-duration:.01s!important}.seal::before{animation:none}}
@media print{
 body{display:block;background:#fff;color:#000;padding:0}
 .no-print,.closed,.sp-top,.sp-bot{display:none!important}#book{display:block!important}
 .scroll,.opened{display:block;width:100%;max-width:none;margin:0;opacity:1;visibility:visible;-webkit-mask-image:none;mask-image:none}
 .sheet-wrap{display:block!important;margin:0!important;background:#fff!important}
 .sheet{overflow:visible}.sheet-in{padding:0;display:block}#pages{opacity:1}
 .page{page-break-after:always;break-after:page;min-height:96vh;border:1px solid #c8b88f;color:#222;padding:40px}
 .page h2{color:#65421f}.message,.guest{color:#222}
}
</style></head>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyWKpS-hgsbjhbk4cJ89nH5aDUXP0-h1ElbuY3m9Vagr8PAyHagBVZZ_FMzcYXCng-s/exec';
let wishes = [], current = 0, accessPassword = '', busy = false;
const $ = id => document.getElementById(id);
const statusEl = $('status'), scroll = $('scroll'), wrap = $('sheetWrap');
const CORNER = '<svg class="corner %C%" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 38V14C2 7 7 2 14 2h24"/><path d="M8 38V16c0-5 3-8 8-8h22" opacity=".55"/><circle cx="14" cy="14" r="2.2" fill="currentColor" stroke="none"/></svg>';

function buildPage(w, empty){
  const page = document.createElement('article');
  page.className = 'page' + (empty ? ' empty' : '');
  
  const h = document.createElement('h2'); h.textContent = empty ? 'Our Wedding Wishes' : 'A Wish for the Couple';
  const rule = document.createElement('div'); rule.className = 'rule'; rule.textContent = '◆ ❦ ◆';
  const m = document.createElement('div'); m.className = 'message';
  m.textContent = empty ? 'Your guests’ wishes will appear here once they have been sent.' : (w.message || '');
  page.append(h, rule, m);
  if (!empty) { const g = document.createElement('div'); g.className = 'guest'; g.textContent = '— ' + (w.name || 'A guest'); page.append(g); }
  return page;
}
function showPage(dir){
  const holder = $('pages'); holder.textContent = '';
  const page = buildPage(wishes[current], !wishes.length);
  if (dir) page.classList.add(dir > 0 ? 'flip-next' : 'flip-prev');
  holder.append(page);
  $('counter').textContent = wishes.length ? `${current + 1} / ${wishes.length}` : '0 wishes';
  $('prev').disabled = current <= 0;
  $('next').disabled = current >= wishes.length - 1;
  $('barFill').style.width = wishes.length ? ((current + 1) / wishes.length * 100) + '%' : '0';
}
function go(d){
  const n = current + d;
  if (busy || n < 0 || n >= wishes.length) return;
  current = n; showPage(d);
}

function openScroll(){
  scroll.classList.add('opening');
  requestAnimationFrame(() => requestAnimationFrame(() => { wrap.classList.add('open'); $('opened').classList.add('show'); }));
  setTimeout(() => { busy = false; }, 2800);
}
function reroll(cb){
  $('opened').classList.remove('show');
  wrap.classList.remove('open');
  setTimeout(cb, 2000);
}

$('eye').addEventListener('click', () => {
  const p = $('pass'), show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('eye').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
});
const focusPass = () => { $('pass').focus(); };
const tapSeal = () => {
  if (busy) return;
  if (!$('pass').value) { focusPass(); statusEl.className = 'status'; statusEl.textContent = 'Type the password first, then tap the seal.'; return; }
  const f = $('gate'); if (f.requestSubmit) f.requestSubmit(); else $('openBtn').click();
};
$('seal').addEventListener('click', tapSeal);
$('seal').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapSeal(); } });

$('gate').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  const btn = $('openBtn');
  accessPassword = $('pass').value;
  btn.disabled = true; statusEl.className = 'status'; statusEl.textContent = 'Checking the seal…';
  try {
    const res = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'list', password: accessPassword})});
    const data = await res.json();
    if (!data.success) throw new Error(data.message || 'Unable to open the book.');
    wishes = (data.wishes || []).slice().reverse(); current = 0;
    busy = true; statusEl.textContent = '';
    scroll.classList.add('broken');
    $('login').style.display = 'none';
    showPage();
    setTimeout(() => { $('book').style.display = 'block'; openScroll(); }, 1000);
  } catch (err) {
    statusEl.className = 'status err';
    statusEl.textContent = err.message === 'Incorrect password.' ? 'That password is incorrect.' : 'Could not connect to the wishes book. Check the Apps Script deployment and try again.';
    scroll.classList.remove('shake'); void scroll.offsetWidth; scroll.classList.add('shake');
  } finally { btn.disabled = false; }
});

$('prev').addEventListener('click', () => go(-1));
$('next').addEventListener('click', () => go(1));
document.addEventListener('keydown', e => {
  if ($('book').style.display !== 'block') return;
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});
let sx = null, sy = null;
const sheet = $('sheet');
sheet.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
sheet.addEventListener('touchend', e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  sx = sy = null;
}, {passive:true});

$('pdf').addEventListener('click', () => {
  const holder = $('pages'); holder.textContent = '';
  if (!wishes.length) { showPage(); window.print(); return; }
  wishes.forEach(w => holder.append(buildPage(w, false)));
  window.print(); setTimeout(() => showPage(), 500);
});

$('logout').addEventListener('click', () => {
  if (busy) return;
  busy = true;
  $('book').style.display = 'none';
  reroll(() => {
    accessPassword = ''; wishes = []; current = 0;
    $('pages').textContent = '';
    $('pass').value = ''; $('pass').type = 'password';
    scroll.classList.remove('opening','broken');
    $('login').style.display = 'block';
    statusEl.className = 'status'; statusEl.textContent = 'The scroll is sealed again.';
    busy = false;
  });
});
</script>
</body></html>
